name: phantom_key
description: "PhantomKey - Gestor de contraseñas cifrado localmente con AES-256"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado global
  provider: ^6.1.2
  # Almacenamiento seguro (Keychain en iOS, Keystore en Android)
  flutter_secure_storage: ^10.2.0
  # Autenticación biométrica (huella, Face ID)
  local_auth: ^3.0.1
  # Cifrado AES-256
  encrypt: ^5.0.3
  # Tipografías modernas
  google_fonts: ^8.1.0
  # Blur y efectos visuales (ya incluido en Flutter)
  # Generación de IDs únicos
  uuid: ^4.5.1
  # Preview en dispositivo (solo desarrollo)
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
